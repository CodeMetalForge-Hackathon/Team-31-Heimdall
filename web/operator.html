<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>HEIMDALL · Drone Operator</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/heimdall.css">
  <link rel="stylesheet" href="css/maps.css">
</head>
<body>
  <header class="op-top">
    <div class="op-title">Heimdall</div>
    <span class="pill connecting" id="conn">connecting</span>
    <span class="topchip hidden" id="drone">Drone: <b>—</b></span>
    <span class="topchip compass hidden" id="compass" title="Station heading">
      <svg viewBox="-12 -12 24 24" aria-hidden="true">
        <circle r="10.5" fill="none" stroke="#24303c" stroke-width="1.5"/>
        <g id="compass-needle"><path d="M0 -9 L3 0 L0 -2 L-3 0 Z" fill="#ffb020"/><path d="M0 9 L3 0 L0 2 L-3 0 Z" fill="#55606b"/></g>
      </svg>
      <b id="compass-text" class="num">—</b>
    </span>
    <div class="mode-toggle" role="group" aria-label="Camera mode">
      <button type="button" id="mode-auto" class="on" aria-pressed="true">Auto</button>
      <button type="button" id="mode-manual" aria-pressed="false">Manual</button>
    </div>
    <span class="health" id="health" aria-label="Station modules"></span>
  </header>

  <main class="op-main">
    <div class="op-col">
      <section class="panel" aria-label="Thermal view">
        <p class="label">Thermal</p>
        <div class="thermal-wrap" id="thermal-wrap">
          <canvas id="thermal-mock"></canvas>
          <img id="thermal-img" alt="Thermal camera" class="hidden">
          <canvas id="thermal-overlay"></canvas>
          <span class="thermal-tag tl" id="thermal-max">max — °C</span>
          <span class="thermal-tag tr" id="thermal-pt">pan — · tilt —</span>
          <span class="thermal-tag bl" id="thermal-src">no feed</span>
        </div>
      </section>

      <section class="panel dial-panel" aria-label="Direction">
        <div class="navbar idle" id="navbar" aria-live="polite">
          <svg class="mnv" id="mnv" viewBox="-12 -12 24 24" aria-hidden="true"><path d="M0 -10.5 L7.8 -1.5 L2.7 -1.5 L2.7 10.5 L-2.7 10.5 L-2.7 -1.5 L-7.8 -1.5 Z"/></svg>
          <div class="navtext">
            <div class="instr idle" id="instr">Waiting</div>
            <div class="target-name" id="target-name">No signal yet</div>
          </div>
        </div>
        <div class="instr-note" id="instr-note"></div>
        <div class="instr-sub" id="instr-sub"></div>
        <!-- the station from above, like "you are here" on a map: front is up, the blue cone is the camera -->
        <svg class="dial" id="dial" viewBox="-110 -110 220 220" role="img" aria-label="Direction dial">
          <defs>
            <radialGradient id="cone-grad" cx="0" cy="0" r="92" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#0a84ff" stop-opacity="0.55"/>
              <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle r="96" class="ring r0"/>
          <circle r="64" class="ring"/>
          <circle r="32" class="ring"/>
          <g id="dial-ticks"></g>
          <text x="0" y="-100.5" class="front">FRONT</text>
          <g id="dial-cam"><path class="cone" d="M0 0 L-22.3 -89.3 A 92 92 0 0 1 22.3 -89.3 Z"/></g>
          <g id="dial-hist"></g>
          <g id="dial-arrow" opacity="0">
            <line class="route-casing" x1="0" y1="-14" x2="0" y2="-72"/>
            <line class="route" x1="0" y1="-14" x2="0" y2="-72"/>
            <circle class="pin" cx="0" cy="-81" r="9.5"/>
            <circle class="pin-dot" cx="0" cy="-81" r="3.3"/>
          </g>
          <circle class="puck-halo" r="19"/>
          <circle class="puck" r="8.5"/>
        </svg>
      </section>
    </div>

    <div class="op-col">
      <section class="panel" aria-label="Triage queue">
        <div class="grabber" aria-hidden="true"></div>
        <p class="label sheet-title">Victims <span class="count" id="queue-count"></span></p>
        <div class="queue" id="queue"><div class="queue-empty">No victims heard yet.</div></div>
      </section>

      <section class="panel hidden" id="sensors-panel" aria-label="Sensors">
        <p class="label">Sensors</p>
        <div class="sensors">
          <div class="scard hidden" id="sc-radar"><p class="label">Radar</p><div class="sbig" id="radar-pres">—</div><div class="sline" id="radar-line">no data</div></div>
          <div class="scard hidden" id="sc-knock"><p class="label">Knock</p><div class="sbig" id="knock-big">—</div><div class="sline" id="knock-line">no knocks yet</div></div>
          <div class="scard hidden" id="sc-sound"><p class="label">Sound</p><div class="sbig" id="sound-big">—</div><div class="sline" id="sound-line">no data</div></div>
          <div class="scard hidden" id="sc-noise"><p class="label">Noise</p>
            <div class="noisebars" id="noise-bars"><div><i></i></div><div><i></i></div><div><i></i></div><div><i></i></div></div>
            <div class="sline" id="noise-line">no data</div>
          </div>
          <div class="scard hidden" id="sc-lora"><p class="label">LoRa</p><div class="sbig" id="lora-big">—</div><div class="sline" id="lora-line">no data</div></div>
          <div class="scard hidden" id="sc-cam"><p class="label">Camera</p><div class="sbig" id="cam-big">—</div><div class="sline" id="cam-line">no data</div></div>
        </div>
      </section>

      <section class="panel aim hidden" id="aim" aria-label="Manual aim">
        <p class="label">Manual aim</p>
        <div class="row"><label for="aim-pan">Pan</label><input type="range" id="aim-pan" min="-90" max="90" step="1" value="0"><output id="aim-pan-v" class="num">0°</output></div>
        <div class="row"><label for="aim-tilt">Tilt</label><input type="range" id="aim-tilt" min="-30" max="60" step="1" value="0"><output id="aim-tilt-v" class="num">0°</output></div>
        <button type="button" class="btn" id="aim-center">Center</button>
      </section>
    </div>
  </main>

  <script src="js/ui-operator.js"></script>
  <script>
    const MOCK = new URLSearchParams(location.search).has('mock') || location.protocol === 'file:';
    const files = MOCK ? ['js/mock.js'] : ['js/operator-live.js'];
    for (const f of files) { const s = document.createElement('script'); s.src = f; s.async = false; document.body.appendChild(s); }
  </script>
</body>
</html>
